name: CI & Quality Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro TypeScript Check
        run: npm run check

      - name: Run Production Build
        env:
          PUBLIC_PHONE: ${{ secrets.PUBLIC_PHONE || '+34 000 00 00 00' }}
        run: npm run build
